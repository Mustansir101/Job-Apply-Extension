<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popup Test Harness</title>
  <link rel="stylesheet" href="../popup.css">
  <style>
    body {
      width: auto;
      max-height: none;
      background: #e9edf6;
      padding: 18px;
    }
    .harness {
      max-width: 760px;
      margin: 0 auto;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .harness h1 { font-size: 20px; margin: 0 0 6px; }
    .harness p { margin: 0 0 12px; color: #59647c; }
    .bar { display: flex; gap: 8px; align-items: center; margin: 12px 0; }
    .bar button {
      border: 1px solid #cfd7e6; background: #fff; border-radius: 7px;
      padding: 7px 11px; font: inherit; font-weight: 650; cursor: pointer;
    }
    #preview {
      width: 404px; height: 600px; border: 1px solid #cfd7e6;
      border-radius: 10px; background: #f7f8fb; box-shadow: 0 8px 30px rgba(20, 30, 60, 0.12);
    }
    #output {
      background: #101827; color: #d9e5ff; padding: 12px; border-radius: 9px;
      font-size: 12px; white-space: pre-wrap; max-height: 360px; overflow: auto;
    }
    .layout { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
    .log { flex: 1; min-width: 280px; }
  </style>
</head>
<body>
  <div class="harness">
    <h1>Popup test harness</h1>
    <p>Loads the real <code>popup.html</code> and <code>popup.js</code> in an iframe with a mocked Chrome API.</p>
    <div class="bar">
      <button id="run" type="button">Run popup tests</button>
      <button id="reset" type="button">Reset mock storage</button>
    </div>
    <div class="layout">
      <iframe id="preview" title="Popup under test"></iframe>
      <div class="log">
        <pre id="output">Ready. Click "Run popup tests".</pre>
      </div>
    </div>
  </div>

  <script>
    window.__store = {};
    window.__executeCalls = [];
    window.__setCalls = [];
    window.__mockConfig = {
      tabUrl: 'https://example.com/apply',
      summary: {
        ok: true,
        platform: 'Google Forms',
        detected: 3,
        filled: [
          { label: 'Full Name', field: 'Full name' },
          { label: 'Email Address', field: 'Email' }
        ],
        skipped: [
          { label: 'Why do you want to join us?', reason: 'No matching profile field' }
        ],
        ignored: 1,
        notes: ['Autofill does not submit forms. Review every answer before submitting.']
      }
    };

    window.__makeChromeMock = function () {
      return {
        storage: {
          local: {
            get: function (keys) {
              var output = {};
              var list;
              if (keys == null) {
                Object.keys(window.__store).forEach(function (key) { output[key] = window.__store[key]; });
                return Promise.resolve(output);
              }
              list = Array.isArray(keys) ? keys : (typeof keys === 'string' ? [keys] : Object.keys(keys));
              list.forEach(function (key) {
                if (Object.prototype.hasOwnProperty.call(window.__store, key)) {
                  output[key] = window.__store[key];
                } else if (keys && typeof keys === 'object' && !Array.isArray(keys) && key in keys) {
                  output[key] = keys[key];
                }
              });
              return Promise.resolve(output);
            },
            set: function (values) {
              Object.assign(window.__store, values);
              window.__setCalls.push(JSON.parse(JSON.stringify(values)));
              return Promise.resolve();
            },
            remove: function (keys) {
              (Array.isArray(keys) ? keys : [keys]).forEach(function (key) { delete window.__store[key]; });
              return Promise.resolve();
            },
            clear: function () {
              Object.keys(window.__store).forEach(function (key) { delete window.__store[key]; });
              return Promise.resolve();
            }
          }
        },
        tabs: {
          query: function () {
            return Promise.resolve([{ id: 1, url: window.__mockConfig.tabUrl }]);
          }
        },
        scripting: {
          executeScript: function (options) {
            window.__executeCalls.push({
              hasFiles: !!options.files,
              allFrames: !!(options.target && options.target.allFrames)
            });
            if (options.files) return Promise.resolve([{ result: null }]);
            return Promise.resolve([{ result: window.__mockConfig.summary }]);
          }
        },
        runtime: { lastError: null }
      };
    };

    async function sleep(ms) {
      return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    async function openPopup() {
      var response = await fetch('/popup.html');
      var html = await response.text();
      var parsed = new DOMParser().parseFromString(html, 'text/html');

      var base = parsed.createElement('base');
      base.setAttribute('href', '/');
      parsed.head.prepend(base);

      var script = parsed.querySelector('script[src="popup.js"]');
      if (script) script.remove();

      var mock = parsed.createElement('script');
      mock.textContent = 'Object.defineProperty(window, "chrome", { value: parent.__makeChromeMock(), configurable: true });';
      parsed.body.appendChild(mock);

      var loader = parsed.createElement('script');
      loader.src = '/popup.js';
      parsed.body.appendChild(loader);

      var iframe = document.getElementById('preview');
      iframe.srcdoc = '<!doctype html>\n' + parsed.documentElement.outerHTML;

      await new Promise(function (resolve) {
        iframe.addEventListener('load', resolve, { once: true });
      });
      await sleep(180);
      return iframe.contentDocument;
    }

    function setValue(doc, id, value) {
      var input = doc.getElementById(id);
      input.value = value;
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }

    var results = [];

    function assert(condition, message) {
      results.push({ ok: !!condition, message: message });
      if (!condition) throw new Error(message);
    }

    async function waitFor(predicate, timeout) {
      var start = Date.now();
      while (Date.now() - start < (timeout || 2000)) {
        if (predicate()) return true;
        await sleep(30);
      }
      return false;
    }

    async function runTests() {
      results = [];
      window.__store = {};
      window.__executeCalls = [];
      window.__setCalls = [];

      var doc = await openPopup();
      assert(doc.getElementById('fullName').value === '', 'Profile fields start empty.');
      assert(doc.getElementById('email').value === '', 'Email field starts empty.');

      var sample = {
        fullName: 'Ada Lovelace',
        email: 'ada@example.com',
        phone: '+91 98765 43210',
        city: 'Pune',
        college: 'Example Institute of Technology',
        degree: 'B.Tech',
        branch: 'CSE',
        graduationYear: '2027',
        cgpa: '8.5',
        linkedin: 'linkedin.com/in/ada',
        github: 'github.com/ada',
        portfolio: 'ada.example.com'
      };

      Object.keys(sample).forEach(function (key) { setValue(doc, key, sample[key]); });
      doc.getElementById('overwrite').checked = true;
      doc.getElementById('overwrite').dispatchEvent(new Event('change', { bubbles: true }));
      doc.getElementById('save').click();

      await waitFor(function () { return !!window.__store.profile; });
      assert(window.__store.profile && window.__store.profile.fullName === 'Ada Lovelace', 'Save persists the profile.');
      assert(window.__store.overwrite === true, 'Overwrite preference is persisted.');

      doc = await openPopup();
      assert(doc.getElementById('fullName').value === 'Ada Lovelace', 'Full name persists after reopening the popup.');
      assert(doc.getElementById('graduationYear').value === '2027', 'Graduation year persists after reopening.');
      assert(doc.getElementById('overwrite').checked === true, 'Overwrite preference restores after reopening.');

      setValue(doc, 'email', 'not-an-email');
      doc.getElementById('save').click();
      await sleep(100);
      assert(doc.getElementById('status').textContent.indexOf('valid email') !== -1, 'Invalid email is rejected with a message.');
      assert(window.__store.profile.email === 'ada@example.com', 'Invalid email does not overwrite the saved profile.');

      setValue(doc, 'email', 'ada@example.com');
      setValue(doc, 'fullName', 'Ada L. Updated');
      doc.getElementById('fill').click();
      await waitFor(function () {
        return doc.getElementById('result-summary').textContent.indexOf('Filled 2 fields') !== -1;
      });

      assert(window.__store.profile.fullName === 'Ada L. Updated', 'Fill auto-saves unsaved edits first.');
      assert(window.__executeCalls.some(function (call) { return call.hasFiles; }), 'Fill injects the matcher and filler files.');
      assert(doc.getElementById('result-summary').textContent === 'Filled 2 fields, skipped 1 field.', 'Result summary shows honest counts.');
      assert(doc.getElementById('status').textContent.indexOf('Filled 2 fields') !== -1, 'Status reports the fill result.');
      assert(doc.getElementById('result-note').textContent.indexOf('1 unsupported field left untouched') !== -1, 'Unsupported field count is reported.');

      var callsBeforeBlocked = window.__executeCalls.length;
      window.__mockConfig.tabUrl = 'chrome://extensions';
      doc.getElementById('fill').click();
      await sleep(120);
      assert(doc.getElementById('status').textContent.indexOf('internal pages') !== -1, 'Internal Chrome pages are rejected gracefully.');
      assert(window.__executeCalls.length === callsBeforeBlocked, 'No script is injected into a blocked page.');

      window.__mockConfig.tabUrl = 'https://example.com/apply';
      window.__store = {};
      doc = await openPopup();
      doc.getElementById('fill').click();
      await sleep(120);
      assert(doc.getElementById('status').textContent.indexOf('Enter and save your profile first') !== -1, 'Fill prompts for a saved profile when empty.');

      var passed = results.filter(function (item) { return item.ok; }).length;
      document.getElementById('output').textContent = results.map(function (item) {
        return (item.ok ? 'PASS ' : 'FAIL ') + item.message;
      }).join('\n') + '\n\n' + passed + '/' + results.length + ' passed';
      return results;
    }

    window.__runPopupTests = runTests;

    document.getElementById('run').addEventListener('click', function () {
      runTests().catch(function (error) {
        document.getElementById('output').textContent = results.map(function (item) {
          return (item.ok ? 'PASS ' : 'FAIL ') + item.message;
        }).join('\n') + '\n\nFAILED: ' + error.message;
      });
    });

    document.getElementById('reset').addEventListener('click', function () {
      window.__store = {};
      window.__executeCalls = [];
      window.__setCalls = [];
      document.getElementById('output').textContent = 'Mock storage reset.';
    });
  </script>
</body>
</html>
